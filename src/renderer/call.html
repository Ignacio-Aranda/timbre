<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; font-src 'self'; media-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; connect-src https: wss:;"
    />
    <title>Timbre — llamada</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="call.css" />
  </head>
  <body class="call-body">
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="i-key" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5" /><path d="M10.7 12.3 20 3M16 7l3 3M14 9l2 2" /></symbol>
        <symbol id="i-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.6a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.5-1.1a2 2 0 0 1 2.1-.5c.8.3 1.7.5 2.6.6a2 2 0 0 1 1.7 2z" /></symbol>
        <symbol id="i-hangup" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.6a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.5-1.1a2 2 0 0 1 2.1-.5c.8.3 1.7.5 2.6.6a2 2 0 0 1 1.7 2z" transform="rotate(135 12 12)" /></symbol>
        <symbol id="i-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3" /><path d="M5 10a7 7 0 0 0 14 0M12 19v3" /></symbol>
        <symbol id="i-switch" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h13l-3-3M21 16H8l3 3" /></symbol>
        <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18" /></symbol>
      </defs>
    </svg>

    <main class="call">
      <div class="stage">
        <img id="photo" class="photo hidden" alt="Visitante" />
        <video id="video" class="video hidden" autoplay playsinline></video>
        <div id="placeholder" class="placeholder">
          <span class="ring-wave"></span>
          <span class="ring-wave ring-wave--2"></span>
          <span class="placeholder__lens"></span>
        </div>
        <div class="stage__grad"></div>
        <div class="header">
          <span id="eyebrow" class="eyebrow">Llamando</span>
          <h1 id="title">Portero</h1>
          <p id="subtitle"></p>
        </div>
      </div>

      <p id="status" class="status"></p>

      <div class="actions">
        <button id="btn-open" class="btn btn--accent">
          <svg class="ico"><use href="#i-key" /></svg>Abrir
        </button>
        <button id="btn-answer" class="btn btn--accept">
          <svg class="ico"><use href="#i-phone" /></svg>Contestar
        </button>
        <button id="btn-talk" class="btn hidden">
          <svg class="ico"><use href="#i-mic" /></svg>Hablar
        </button>
        <button id="btn-switch" class="btn hidden">
          <svg class="ico"><use href="#i-switch" /></svg>Cambiar
        </button>
        <button id="btn-hangup" class="btn btn--danger">
          <svg class="ico"><use href="#i-hangup" /></svg><span id="hangup-label">Colgar</span>
        </button>
      </div>
      <button id="btn-mute" class="btn btn--subtle btn--block hidden">Silenciar micrófono</button>
    </main>
    <script src="call.bundle.js"></script>
  </body>
</html>
