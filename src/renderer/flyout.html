<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; font-src 'self'; media-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; connect-src https: wss:;"
    />
    <title>Timbre</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="flyout.css" />
  </head>
  <body class="fly-body">
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="i-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" /><path d="M13.7 21a2 2 0 0 1-3.4 0" /></symbol>
        <symbol id="i-log" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h12M8 12h12M8 18h12" /><circle cx="3.5" cy="6" r="1.1" fill="currentColor" stroke="none" /><circle cx="3.5" cy="12" r="1.1" fill="currentColor" stroke="none" /><circle cx="3.5" cy="18" r="1.1" fill="currentColor" stroke="none" /></symbol>
        <symbol id="i-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" /></symbol>
        <symbol id="i-camera" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z" /><rect x="1" y="5" width="15" height="14" rx="2.5" /></symbol>
        <symbol id="i-key" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5" /><path d="M10.7 12.3 20 3M16 7l3 3M14 9l2 2" /></symbol>
        <symbol id="i-switch" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h13l-3-3M21 16H8l3 3" /></symbol>
        <symbol id="i-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.6a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.5-1.1a2 2 0 0 1 2.1-.5c.8.3 1.7.5 2.6.6a2 2 0 0 1 1.7 2z" /></symbol>
        <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6" /></symbol>
      </defs>
    </svg>

    <header class="fly-head">
      <div class="fly-brand">
        <span class="fly-mark"><svg class="ico"><use href="#i-bell" /></svg></span>
        <div class="fly-brand__t">
          <strong>Timbre</strong>
          <span id="fly-status" class="fly-status"><span class="dot"></span>Sin configurar</span>
        </div>
      </div>
      <div class="fly-head__actions">
        <button id="fly-log" class="iconbtn" title="Registro"><svg class="ico"><use href="#i-log" /></svg></button>
        <button id="fly-settings" class="iconbtn" title="Ajustes"><svg class="ico"><use href="#i-settings" /></svg></button>
      </div>
    </header>

    <!-- Devices -->
    <section id="fly-devices" class="fly-body-view">
      <div id="fly-empty" class="fly-empty hidden">
        <span class="fly-empty__mark"><svg class="ico"><use href="#i-bell" /></svg></span>
        <p>Aún no has configurado Timbre.</p>
        <button id="fly-setup" class="btn btn--accent">Abrir ajustes</button>
      </div>
      <div id="fly-list" class="fly-list"></div>
    </section>

    <!-- Camera / call -->
    <section id="fly-camera" class="fly-camera hidden">
      <div class="fly-stage">
        <img id="fly-photo" class="fly-media hidden" alt="Visitante" />
        <video id="fly-video" class="fly-media hidden" autoplay playsinline></video>
        <div id="fly-ph" class="fly-ph">
          <span class="ring-wave"></span><span class="ring-wave ring-wave--2"></span>
          <span class="fly-lens"></span>
        </div>
        <div class="fly-stage__grad"></div>
        <button id="fly-back" class="fly-back" title="Volver"><svg class="ico"><use href="#i-back" /></svg></button>
        <div class="fly-caption">
          <span id="fly-eyebrow" class="fly-eyebrow"></span>
          <h2 id="fly-title"></h2>
        </div>
      </div>
      <p id="fly-cam-status" class="fly-cam-status"></p>
      <div class="fly-cam-actions">
        <button id="fly-open" class="btn btn--accent"><svg class="ico"><use href="#i-key" /></svg>Abrir</button>
        <button id="fly-answer" class="btn btn--accept hidden"><svg class="ico"><use href="#i-phone" /></svg>Contestar</button>
        <button id="fly-switch" class="btn hidden"><svg class="ico"><use href="#i-switch" /></svg>Cambiar</button>
        <button id="fly-hangup" class="btn btn--danger"><svg class="ico"><use href="#i-phone" /></svg><span id="fly-hangup-label">Colgar</span></button>
      </div>
    </section>

    <script src="flyout.bundle.js"></script>
  </body>
</html>
